<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CV browser checks</title>
<body><pre id="results">RUNNING</pre><iframe id="cv" src="../index.html" title="Résumé under test" style="width:1280px;height:900px"></iframe>
<script>
const frame = document.querySelector('#cv');
const results = document.querySelector('#results');
const checks = [];
const errors = [];
function check(condition, label) { if (!condition) throw new Error(label); checks.push('PASS ' + label); }
function load() { return new Promise(resolve => frame.addEventListener('load', resolve, { once: true })); }
function monitor() {
  frame.contentWindow.addEventListener('error', event => errors.push(event.message));
  frame.contentWindow.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
}
function choose(lang) {
  const doc = frame.contentDocument;
  doc.querySelector('#language-toggle').click();
  doc.querySelector(`[data-language="${lang}"]`).click();
}
function coverage(lang) {
  const doc = frame.contentDocument;
  const dict = frame.contentWindow.CV_LOCALES[lang];
  doc.querySelectorAll('[data-i18n]').forEach(element => {
    if (element.matches('.theme-label,.download-button')) return;
    element.dataset.i18n.split(' ').forEach(key => {
      check([...element.childNodes].some(node => node.nodeType === 3 && node.textContent.trim() === dict[key]), `${lang}: ${key}`);
    });
  });
  check(!/\bt\d{3}\b/.test(doc.body.innerText), 'No translation keys visible');
  check(!doc.querySelector('a[href^="mailto:"], a[href^="tel:"]'), lang + ': no personal contact links');
  check(!/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(doc.documentElement.outerHTML), lang + ': no email in DOM');
  check(!/\+?55[\s()-]*44[\s()-]*9(?:[\s()-]*\d){8}|44[\s()-]*9(?:[\s()-]*\d){8}/.test(doc.documentElement.outerHTML), lang + ': no personal phone in DOM');
}
(async () => {
  await load();
  const win = frame.contentWindow;
  win.localStorage.removeItem('cv-language');
  let loaded = load(); win.location.reload(); await loaded;
  monitor();
  const doc = frame.contentDocument;
  check(doc.documentElement.lang === 'pt-BR', 'Default Portuguese'); coverage('pt-BR');
  for (const lang of ['es-AR', 'en', 'pt-BR']) {
    choose(lang); check(doc.documentElement.lang === lang, 'Switch to ' + lang); coverage(lang);
  }
  choose('en');
  doc.querySelector('.theme-toggle').click();
  check(doc.querySelector('.theme-label').textContent === 'Futuristic mode', 'English minimal theme label');
  choose('es-AR');
  check(doc.querySelector('.theme-label').textContent === 'Modo futurista', 'Theme label follows Spanish');
  check(doc.documentElement.dataset.theme === 'minimalista', 'Language preserves theme');
  doc.querySelector('.theme-toggle').click();
  check(doc.querySelector('.theme-label').textContent === 'Modo minimalista', 'Theme toggles after translation');
  const toggle = doc.querySelector('#language-toggle');
  toggle.click(); check(doc.activeElement.dataset.language === 'es-AR', 'Opening focuses active language');
  doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key:'ArrowDown', bubbles:true }));
  check(doc.activeElement.dataset.language === 'en', 'Arrow keys navigate');
  doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key:'Escape', bubbles:true }));
  check(doc.querySelector('#language-options').hidden && doc.activeElement === toggle, 'Escape closes and restores focus');
  toggle.click(); doc.body.click(); check(doc.querySelector('#language-options').hidden, 'Outside click closes');
  let prints = 0; win.print = () => { prints++; };
  const expectedFiles = { 'pt-BR':'PT', 'es-AR':'ES', en:'EN' };
  const sha256 = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');
  // Exercise the real click handler; intercept only the final browser save action.
  async function exerciseDownload(lang) {
    choose(lang);
    const d = frame.contentDocument;
    const button = d.querySelector('.download-button');
    const filename = `Richard_Marlon_Balestrim_CV_${expectedFiles[lang]}.pdf`;
    check(button.getAttribute('href') === 'assets/cv/'+filename, lang+': matching relative URL');
    check(button.download === filename && button.hreflang === lang, lang+': download filename and language');
    const response = await fetch(button.href);
    check(response.ok && response.headers.get('content-type').includes('pdf'), lang+': PDF accessible over HTTP');
    const expected = await response.arrayBuffer();
    const saved = await new Promise((resolve,reject) => {
      const timeout = setTimeout(()=>{d.removeEventListener('click',capture,true);reject(Error('Download timed out: '+lang));},5000);
      function capture(event) {
        const a = event.target.closest('a');
        if (!a?.href.startsWith('blob:')) return;
        event.preventDefault(); clearTimeout(timeout);d.removeEventListener('click',capture,true);
        fetch(a.href).then(r=>r.arrayBuffer()).then(bytes=>resolve({bytes,filename:a.download}),reject);
      }
      d.addEventListener('click',capture,true);button.click();
    });
    check(saved.filename === filename, lang+': click saves matching filename');
    check(await sha256(saved.bytes) === await sha256(expected),lang+': click preserves file bytes');
    if(lang === 'pt-BR') check(await sha256(saved.bytes) === '55aeac1f9e297b7415038956cc07b06bde70345ba00f92853a2b759736e02788','Portuguese original SHA-256');
  }
  for (const lang of Object.keys(expectedFiles)) await exerciseDownload(lang);
  choose('es-AR');
  const originalFetch=win.fetch;
  win.fetch=async()=>({ok:false,status:404});
  doc.querySelector('.download-button').click();
  await new Promise(resolve=>setTimeout(resolve,50));
  check(!doc.querySelector('#download-status').hidden && doc.querySelector('#download-status').textContent===win.CV_LOCALES['es-AR'].downloadUnavailable,'Missing PDF displays Spanish error');
  win.fetch=originalFetch;
  check(prints === 0, 'Downloads never invoke print');
  choose('en');
  loaded = load(); win.location.reload(); await loaded;
  monitor();
  check(frame.contentDocument.documentElement.lang === 'en', 'Saved language restored after reload');
  for (const width of [320, 375, 700, 768, 1024, 1280]) {
    frame.style.width = width + 'px';
    await new Promise(resolve => setTimeout(resolve, 60));
    for (const lang of ['pt-BR','es-AR','en']) {
      choose(lang);
      const d = frame.contentDocument;
      check(d.querySelector('.download-button').getAttribute('href').endsWith('_'+expectedFiles[lang]+'.pdf'), `${width}px ${lang}: matching download`);
      check(d.documentElement.scrollWidth <= width, `${width}px ${lang}: no horizontal overflow`);
      const bar = d.querySelector('.topbar').getBoundingClientRect();
      const picker = d.querySelector('#language-toggle').getBoundingClientRect();
      const theme = d.querySelector('.theme-toggle').getBoundingClientRect();
      const print = d.querySelector('.download-button').getBoundingClientRect();
      check(picker.right <= theme.left && theme.right <= print.left && print.right <= bar.right, `${width}px ${lang}: controls do not overlap`);
      d.querySelector('#language-toggle').click();
      const menu = d.querySelector('#language-options').getBoundingClientRect();
      check(menu.left >= 0 && menu.right <= width, `${width}px ${lang}: language menu stays within viewport`);
      d.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key:'Escape', bubbles:true }));
      if (width <= 700) {
        d.querySelector('.menu-toggle').click();
        check(d.querySelector('.menu-toggle').getAttribute('aria-expanded') === 'true', `${width}px ${lang}: mobile navigation opens`);
        d.querySelector('nav a[href="#resumo"]').click();
        check(d.querySelector('.menu-toggle').getAttribute('aria-expanded') === 'false' && d.activeElement.id === 'resumo', `${width}px ${lang}: mobile navigation closes and focuses content`);
      }
    }
  }
  frame.style.width = '375px';
  for (const lang of Object.keys(expectedFiles)) await exerciseDownload(lang);
  check(errors.length === 0, 'No JavaScript errors: ' + errors.join(', '));
  frame.contentWindow.localStorage.removeItem('cv-language');
  results.textContent = `SUCCESS: ${checks.length} checks\n` + checks.join('\n');
})().catch(error => { results.textContent = 'FAIL: ' + error.stack + '\n' + checks.join('\n'); });
</script></body></html>
